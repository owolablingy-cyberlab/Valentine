<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Protocol</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Dancing+Script:wght@600&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-color: #2b0510;
            --primary-pink: #ff005c;
            --soft-pink: #ff99c8;
            --gold: #ffd700;
            --glass-panel: rgba(40, 0, 15, 0.9);
            --input-bg: rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #4a0a1f 0%, #000 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ANIMATED BACKGROUND */
        .bg-hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart-bg { position: absolute; bottom: -10vh; color: rgba(255, 0, 92, 0.1); font-size: 3rem; animation: floatUp 15s linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-120vh); opacity: 0; } }

        /* MAIN CARD */
        .container {
            background: var(--glass-panel);
            backdrop-filter: blur(15px);
            padding: 2.5rem;
            border: 1px solid rgba(255, 0, 92, 0.2);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255, 0, 92, 0.15);
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem; margin: 0 0 1.5rem 0;
            background: linear-gradient(to right, var(--soft-pink), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hidden { display: none !important; }

        /* INPUTS */
        .input-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
        label { font-size: 0.75rem; color: var(--soft-pink); display: block; margin-bottom: 8px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
        
        input, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #444;
            color: white;
            padding: 14px;
            font-family: 'Poppins', sans-serif;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        input:focus, textarea:focus { border-color: var(--primary-pink); box-shadow: 0 0 15px rgba(255, 0, 92, 0.2); }

        /* MUSIC SEARCH UI */
        #search-results {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: #151515; border: 1px solid #333;
            border-radius: 0 0 12px 12px; max-height: 220px;
            overflow-y: auto; z-index: 50; display: none;
        }
        .track-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #222; transition: 0.2s; }
        .track-item:hover { background: #222; }
        .track-img { width: 45px; height: 45px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { text-align: left; flex: 1; }
        .track-name { font-size: 0.9rem; font-weight: 600; color: #fff; }
        .track-artist { font-size: 0.75rem; color: #888; }

        /* SELECTED SONG UI */
        #selected-song-display {
            display: none; background: rgba(0, 255, 92, 0.05);
            border: 1px solid var(--primary-pink); padding: 10px;
            border-radius: 12px; margin-top: 10px; text-align: left; align-items: center;
        }
        #selected-song-display img { width: 40px; height: 40px; border-radius: 6px; margin-right: 10px; }
        .remove-song { margin-left: auto; color: #ff3333; cursor: pointer; padding: 5px; }

        /* MAIN BUTTONS */
        button.action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), #ff5c8d);
            color: white; border: none; padding: 16px;
            font-weight: 600; cursor: pointer; border-radius: 50px;
            margin-top: 10px; transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,0,92,0.4); }

        /* --- SHARE OPTIONS UI --- */
        #share-options {
            display: none; /* Hidden by default */
            margin-top: 25px;
            animation: fadeIn 0.5s ease;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .success-text {
            color: var(--gold);
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        button.btn-outline {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--soft-pink);
            color: var(--soft-pink);
        }
        button.btn-outline:hover { background: rgba(255, 153, 200, 0.15); }

        button.btn-fill {
            background: var(--gold);
            color: black;
            border: none;
        }
        button.btn-fill:hover { background: #ffe44d; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* FINAL REVEAL */
        #final-content { display: none; text-align: center; width: 100%; animation: zoomIn 0.8s ease; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #final-message {
            font-family: 'Dancing Script', cursive; font-size: 2.5rem;
            color: #fff; text-shadow: 0 0 20px var(--primary-pink);
            white-space: pre-wrap; margin-bottom: 25px; line-height: 1.4;
        }
        
        .playing-art {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            animation: spin 8s linear infinite; margin: 20px auto; display: block;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .now-playing-tag {
            background: rgba(255,215,0,0.1); border: 1px solid var(--gold);
            color: var(--gold); padding: 5px 15px; border-radius: 20px;
            font-size: 0.75rem; display: inline-block; margin-top: 10px;
        }
        /* --- WATERMARK STYLING --- */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace; /* Tech vibe */
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 9999; /* Always on top */
            transform-origin: top center; /* This makes it swing from the top */
            animation: dangle 3s ease-in-out infinite;
            backdrop-filter: blur(4px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none; /* Allows clicking through it if needed */
        }

        /* THE DANGLING ANIMATION */
        @keyframes dangle {
            0% { transform: rotate(3deg); }
            50% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        /* Optional: Make it look like it's hanging by a thread */
        .watermark::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 15px;
            background: var(--gold);
        }
        .watermark::after {
            content: '';
            position: absolute;
            top: -18px; /* Top of the thread */
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--primary-pink);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="watermark">Created by Iyanuoluwa</div>

    <div class="bg-hearts">
        <div class="heart-bg" style="left: 10%; animation-duration: 12s;">❤</div>
        <div class="heart-bg" style="left: 80%; animation-duration: 18s;">❤</div>
    </div>

    <audio id="bg-music" loop></audio>

    <div id="create-mode" class="container">
        <h1>Create Love Lock</h1>
        
        <div class="input-group">
            <label>Sender Name (The Key)</label>
            <input type="text" id="sender-name" placeholder="Who is sending this?">
        </div>

        <div class="input-group">
            <label>Secret Message</label>
            <textarea id="secret-text" rows="3" placeholder="Write your feelings..."></textarea>
        </div>

        <div class="input-group">
            <label>Attach a Song</label>
            <input type="text" id="song-search" placeholder="Search song (e.g. Asake, Wizkid)..." autocomplete="off">
            <div id="search-results"></div> 

            <div id="selected-song-display">
                <img id="selected-art" src="" alt="Art">
                <div class="track-info">
                    <div id="selected-title" class="track-name"></div>
                    <div id="selected-artist" class="track-artist"></div>
                </div>
                <div class="remove-song" onclick="removeSong()"><i class="fas fa-times"></i></div>
            </div>
        </div>

        <button id="seal-btn" class="action-btn" onclick="generateLink()">
            <i class="fas fa-heart-circle-bolt"></i> LOCK MY HEART
        </button>

        <div id="share-options">
            <div class="success-text"><i class="fas fa-check-circle"></i> Message Secured</div>
            
            <div class="btn-grid">
                <button class="action-btn btn-fill" onclick="shareLink()">
                    <i class="fas fa-paper-plane"></i> Share Now
                </button>

                <button class="action-btn btn-outline" onclick="copyLink()">
                    <i class="fas fa-link"></i> <span id="copy-text">Copy Hidden Link</span>
                </button>
            </div>
        </div>
    </div>

    <div id="unlock-mode" class="container hidden">
        <h1>Incoming Message</h1>
        <p>A secret heart-lock has been sent to you.</p>

        <div class="input-group">
            <input type="text" id="unlock-pass" placeholder="Enter Sender's Name" style="text-align:center;">
        </div>

        <button class="action-btn" onclick="decryptMessage()">
            <i class="fas fa-key"></i> Unlock Heart
        </button>
        <p id="error-msg" style="color:var(--gold); margin-top:10px; font-size:0.8rem;"></p>
    </div>

    <div id="final-content">
        <img id="reveal-art" class="playing-art" src="" style="display:none;">
        <div id="reveal-song-info" class="now-playing-tag" style="display:none;"></div>
        
        <br><br>
        <h1 id="final-message"></h1>
        
        <div id="reveal-sender" style="color: #666; font-size: 0.8rem; margin-top: 30px; letter-spacing: 2px;"></div>
    </div>
    <div class="watermark">Created by Iyanuoluwa</div>

    <script>
        // --- LOGIC ---
        
        let selectedTrack = null;
        let debounceTimer;
        let generatedFullLink = ""; 

        // 1. ROUTING
        const urlParams = new URLSearchParams(window.location.search);
        const encryptedPayload = urlParams.get('data');
        const createMode = document.getElementById('create-mode');
        const unlockMode = document.getElementById('unlock-mode');

        if(encryptedPayload) {
            createMode.classList.add('hidden');
            unlockMode.classList.remove('hidden');
        } else {
            createMode.classList.remove('hidden');
            unlockMode.classList.add('hidden');
        }

        // 2. MUSIC SEARCH
        const searchInput = document.getElementById('song-search');
        const resultsBox = document.getElementById('search-results');

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if(query.length < 2) { resultsBox.style.display = 'none'; return; }
            debounceTimer = setTimeout(() => fetchMusic(query), 500);
        });

        async function fetchMusic(query) {
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
                if (!res.ok) throw new Error("Net error");
                const data = await res.json();
                resultsBox.innerHTML = '';
                
                // Filter unplayable songs
                const validSongs = data.results.filter(track => track.previewUrl);

                if(validSongs.length > 0) {
                    resultsBox.style.display = 'block';
                    validSongs.slice(0, 5).forEach(track => {
                        const div = document.createElement('div');
                        div.className = 'track-item';
                        div.innerHTML = `
                            <img src="${track.artworkUrl60}" class="track-img">
                            <div class="track-info"><div class="track-name">${track.trackName}</div><div class="track-artist">${track.artistName}</div></div>
                        `;
                        div.onclick = () => selectSong(track);
                        resultsBox.appendChild(div);
                    });
                } else { resultsBox.style.display = 'none'; }
            } catch (err) { console.error(err); }
        }

        function selectSong(track) {
            selectedTrack = { url: track.previewUrl, title: track.trackName, artist: track.artistName, art: track.artworkUrl100 };
            document.getElementById('selected-art').src = track.artworkUrl60;
            document.getElementById('selected-title').innerText = track.trackName;
            document.getElementById('selected-artist').innerText = track.artistName;
            document.getElementById('selected-song-display').style.display = 'flex';
            resultsBox.style.display = 'none';
            searchInput.value = '';
        }

        function removeSong() {
            selectedTrack = null;
            document.getElementById('selected-song-display').style.display = 'none';
        }

        // 3. GENERATE
     /// 3. GENERATE (COMPRESSED VERSION)
        async function generateLink() {
            const sender = document.getElementById('sender-name').value.trim();
            const message = document.getElementById('secret-text').value;
            const btn = document.getElementById('seal-btn');

            if(!sender || !message) { alert("Please fill in Name and Message!"); return; }

            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GENERATING...';
            btn.disabled = true;

            try {
                // --- COMPRESSION STEP ---
                // We rename keys to single letters to save space
                // m = message, t = track data, n = name, a = artist, u = url, i = image
                let minifiedTrack = null;
                if(selectedTrack) {
                    minifiedTrack = {
                        n: selectedTrack.title,
                        a: selectedTrack.artist,
                        u: selectedTrack.url,
                        i: selectedTrack.art
                    };
                }

                const payload = { m: message, t: minifiedTrack };
                // ------------------------

                const encrypted = CryptoJS.AES.encrypt(JSON.stringify(payload), sender.toLowerCase()).toString();
                const longLink = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(encrypted)}`;

                // Try to shorten
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longLink)}`);
                
                if (response.ok) {
                    generatedFullLink = await response.text();
                } else {
                    throw new Error("Shortening failed");
                }

            } catch (err) {
                console.warn("Link too heavy, falling back:", err);
                generatedFullLink = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(encrypted)}`;
            }

            btn.style.display = 'none';
            document.getElementById('share-options').style.display = 'block';
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
            fireConfetti();
        }

        // 4. SHARE
        function copyLink() {
            navigator.clipboard.writeText(generatedFullLink).then(() => {
                const btnText = document.getElementById('copy-text');
                btnText.innerText = "COPIED!";
                setTimeout(() => { btnText.innerText = "Copy Hidden Link"; }, 2000);
            });
        }

        async function shareLink() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Lock My Heart',
                        text: 'I have created a secure message for you. Open it here:',
                        url: generatedFullLink
                    });
                } catch (err) { console.log('Error sharing:', err); }
            } else {
                copyLink();
                alert("Link copied! Paste it in WhatsApp.");
            }
        }

        // 5. DECRYPT
        // 5. DECRYPT (COMPATIBLE WITH COMPRESSED DATA)
        function decryptMessage() {
            const pass = document.getElementById('unlock-pass').value.trim().toLowerCase();
            const errorMsg = document.getElementById('error-msg');
            
            if(!pass) { errorMsg.innerText = "Enter Name."; return; }

            try {
                const bytes = CryptoJS.AES.decrypt(encryptedPayload, pass);
                const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);

                if(decryptedStr) {
                    const data = JSON.parse(decryptedStr);
                    
                    // --- DECOMPRESS STEP ---
                    // Check if it's the new "Mini" format (m/t) or old format (msg/track)
                    const msgText = data.m || data.msg; 
                    const trackData = data.t || data.track;
                    // -----------------------

                    unlockMode.classList.add('hidden');
                    const finalDiv = document.getElementById('final-content');
                    finalDiv.style.display = 'block';
                    
                    document.getElementById('final-message').innerText = msgText;
                    document.getElementById('reveal-sender').innerText = `// SENT BY ${pass.toUpperCase()}`;
                    fireConfetti(); 

                    // Handle Music (Support both Mini keys and Old keys)
                    if(trackData && (trackData.u || trackData.url)) {
                        const audio = document.getElementById('bg-music');
                        // Use .u (new) or .url (old)
                        audio.src = trackData.u || trackData.url;
                        audio.volume = 0.5;

                        document.getElementById('reveal-art').src = trackData.i || trackData.art;
                        document.getElementById('reveal-art').style.display = 'block';
                        
                        const title = trackData.n || trackData.title;
                        const info = document.getElementById('reveal-song-info');
                        info.innerHTML = `<i class="fas fa-music"></i> Playing: ${title}`;
                        info.style.display = 'inline-block';

                        const playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(() => {
                                info.innerHTML += `<br><button onclick="document.getElementById('bg-music').play()" style="background:var(--gold); border:none; padding:5px; border-radius:4px; margin-top:5px; cursor:pointer;">▶ TAP TO PLAY</button>`;
                            });
                        }
                    }

                } else { throw new Error(); }
            } catch(e) {
                console.log(e);
                errorMsg.innerText = "Wrong Name.";
                const btn = document.querySelector('#unlock-mode button');
                btn.style.transform = "translateX(10px)";
                setTimeout(() => btn.style.transform = "translateX(0)", 100);
            }
        }
    </script>
</body>
</html>
